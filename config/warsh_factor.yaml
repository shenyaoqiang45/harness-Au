# 沃什因子：美联储主席公开表态对黄金的多空影响（定性打分）
# 分数区间 [-1, +1]：正值偏多金，负值偏空金
# 每次主席重大讲话后更新 dimensions，并调整 meta 日期与失效日

meta:
  chair: Kevin Warsh
  speech_date: 2026-08-28
  venue: Jackson Hole Economic Policy Symposium keynote
  source: https://www.federalreserve.gov/newsevents/speech/warsh20260828a.htm
  last_updated: 2026-08-31
  valid_until: 2026-09-15
  note: >
    08-28 Jackson Hole 主旨演讲《In Our Time》。相对 7/29 记者会明显偏鹰：
    通胀为「当下首要焦点」；PCE 同比 3.7%、六个月年化 4.1%；夏季 CPI/PCE 好于预期
    「并不表明潜在趋势已实质改善」；2% PCE 为「firm, fixed target」，物价稳定不会自动回归；
    「若无法确信潜在通胀正以足够速度朝目标前进，我们就还有工作要做」。
    金融条件「很难称为限制性」；短期利率为双使命主要工具；非常规政策仅限危机。
    继续拒绝前瞻指引与显式反应函数；「committed to a discipline, not to a decision」。
    市场：2 年期国债大涨，CME 9 月加息概率约 35%→55–63%。未改利率路径承诺。
    未新增 market_events 行（加息/再通胀风险已由本因子覆盖，避免双计）。

dimensions:
  inflation_hawkishness:
    score: -0.80
    weight: 1.5
    label: 抗通胀强硬
    description: 「价格是当下首要焦点」；2% PCE 为固定目标、不会自动回归；「we have work to do」打开加息门；金融条件「很难称为限制性」

  inflation_risk_easing:
    score: 0.10
    weight: 1.0
    label: 通胀风险缓和
    description: 承认夏季读数好于预期，但明确否定「潜在趋势已实质改善」；PCE 3.7%/六个月 4.1%；54% 分项同比>3%（疫情前约 32%）

  no_forward_guidance:
    score: -0.40
    weight: 0.8
    label: 废除前瞻指引
    description: 开场即「不要叫前瞻指引」；拒绝显式反应函数与泰勒规则路径；主张 quieter Fed，避免市场把联储当下一笔交易的对手方

  qt_commitment:
    score: -0.25
    weight: 1.0
    label: 缩表立场
    description: 短期利率为双使命主要工具；非常规政策仅限真正危机、应少用；未强化新的缩表鹰派，但「money matters」把基础货币重新拉回视野

  ai_supply_optimism:
    score: 0.40
    weight: 1.2
    label: AI供给扩张预期
    description: 长段 AI/生产率叙事；设备与无形资产投资同比约 9%、半数以上与 AI 相关；但任务组成果「与当前政策窗口无关」，近月加息判断不绑供给乐观

  fed_independence:
    score: 0.30
    weight: 0.3
    label: 央行独立性
    description: 「65 个月持续偏高通胀的责任在央行」；市场相信将交付物价稳定「I can assure you they're right」；未回应白宫降息偏好，机构问责叙事强化

  communication_uncertainty:
    score: -0.25
    weight: 0.5
    label: 沟通改革不确定性
    description: 方向比 7/29 更清楚（偏鹰、价格优先），但仍「committed to a discipline, not to a decision」；9 月路径未承诺，无反应函数，短端定价仍易跳变
